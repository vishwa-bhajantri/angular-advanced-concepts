<div class="container py-5">
    <div class="card shadow border-0">
        <div class="card-header bg-primary text-white p-4">
            <h2 class="mb-1">Angular Signals Set(), update(), computed() and effect()</h2>
            <p class="mb-0">Employee Salary Example</p>
        </div>

        <div class="card-body p-4">
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="border rounded p-3 bg-light h-100">
                        <small class="text-muted">Employee Name</small>
                        <h4 class="mb-0 mt-1">{{employeeName()}}</h4>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="border rounded p-3 bg-light h-100">
                        <small class="text-muted">Monthly Salary</small>
                        <h4 class="mb-0 mt-1 text-success">{{basicSalary()}}</h4>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="border rounded p-3 bg-light h-100">
                        <small class="text-muted">Yearly Salary - computed()</small>
                        <h4 class="mb-0 mt-1 text-primary">{{yearlySalary()}}</h4>
                    </div>
                </div>

            </div>

            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-primary" (click)="changeEmployeeName()">Change Name - set()</button>
                <button class="btn btn-success" (click)="setSalary()">Set Salary to 50,000</button>
                <button class="btn btn-warning" (click)="updateSalary()">Add 5,000 - update()</button>
            </div>

            <div class="alert alert-info mt-4 mb-0">
                open the browser console whenever the name or salary changes.
                <strong>effect()</strong>print the update values
            </div>
        </div>
    </div>
</div>
